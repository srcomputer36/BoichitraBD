    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      const CACHE_KEY = 'boichitra_cpanel_fast_v9';

      function makeBlobUrl(jsCode) {
        return URL.createObjectURL(new Blob([jsCode], { type: 'text/javascript' }));
      }

      function loadBabelOnce() {
        if (window.Babel) return Promise.resolve(window.Babel);
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.9/babel.min.js';
          s.onload = () => resolve(window.Babel);
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function compileTsx(source, filename) {
        return window.Babel.transform(source, {
          presets: ['react', 'typescript'],
          filename,
        }).code;
      }

      const replaceImports = (code, map) => {
        let out = code;
        for (const [target, blobUrl] of Object.entries(map)) {
          out = out.split("'" + target + "'").join("'" + blobUrl + "'");
          out = out.split('"' + target + '"').join('"' + blobUrl + '"');
        }
        return out;
      };

      async function bootBoichitra() {
        let compiled = null;

        // 1. Check fast localStorage cache first (0ms)
        try {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached) {
            compiled = JSON.parse(cached);
          }
        } catch (_e) {}

        // 2. Check server-side pre-compiled bundle cache (/api/compiled-bundle) — avoids loading 2.8MB Babel!
        if (!compiled) {
          try {
            const prefetched = window.__BOICHITRA_BUNDLE_PREFETCH__
              ? await window.__BOICHITRA_BUNDLE_PREFETCH__
              : await fetch('/api/compiled-bundle').then((r) => (r.ok ? r.json() : null));
            window.__BOICHITRA_BUNDLE_PREFETCH__ = null;
            if (prefetched && prefetched.cached && prefetched.compiled && prefetched.compiled.app) {
              compiled = prefetched.compiled;
              try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(compiled));
              } catch (_e) {}
            }
          } catch (_e) {}
        }

        // 3. Only if neither localStorage nor server has cached bundle yet, compile 4 storefront files & save to server
        if (!compiled) {
          const files = [
            '/src/lib/bd-locations.ts',
            '/src/lib/visuals.ts',
            '/src/components/ProductVisualCard.tsx',
            '/src/App.tsx',
          ];
          const [sources] = await Promise.all([
            Promise.all(
              files.map(async (url) => {
                const res = await fetch(url + '?v=9');
                if (!res.ok) throw new Error('Failed to load ' + url);
                return res.text();
              })
            ),
            loadBabelOnce(),
          ]);

          compiled = {
            bdLocations: compileTsx(sources[0], 'bd-locations.ts'),
            visuals: compileTsx(sources[1], 'visuals.ts') + '\nexport const ParsedMediaItem = {};',
            productCard: compileTsx(sources[2], 'ProductVisualCard.tsx'),
            app: compileTsx(sources[3], 'App.tsx'),
          };

          try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(compiled));
          } catch (_e) {}

          // Save compiled bundle on server so all future visitors skip Babel completely!
          fetch('/api/compiled-bundle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ compiled }),
          }).catch(() => {});
        }

        const typesUrl = makeBlobUrl(
          'export const CartItem = {}; export const Category = {}; export const Coupon = {}; export const Product = {}; export const ProductVariant = {}; export const StoreSettings = {}; export const AuditLogRecord = {}; export const CustomerRecord = {}; export const OrderRecord = {};'
        );
        const bdLocationsUrl = makeBlobUrl(compiled.bdLocations);
        const visualsUrl = makeBlobUrl(compiled.visuals);

        const productCardUrl = makeBlobUrl(
          replaceImports(compiled.productCard, {
            '../types.ts': typesUrl,
            '../lib/bd-locations.ts': bdLocationsUrl,
            '../lib/visuals.ts': visualsUrl,
          })
        );

        // Lazy on-demand loader for AdminPanel.tsx (only downloaded & compiled when visiting /admin)
        window.__BOICHITRA_LOAD_ADMIN__ = async () => {
          if (window.__BOICHITRA_ADMIN_MOD__) return window.__BOICHITRA_ADMIN_MOD__;
          const [adminSrc] = await Promise.all([
            fetch('/src/components/AdminPanel.tsx?v=9').then((r) => r.text()),
            loadBabelOnce(),
          ]);
          const adminJs = compileTsx(adminSrc, 'AdminPanel.tsx');
          const adminBlobUrl = makeBlobUrl(
            replaceImports(adminJs, {
              '../types.ts': typesUrl,
              '../lib/bd-locations.ts': bdLocationsUrl,
              '../lib/visuals.ts': visualsUrl,
              './ProductVisualCard.tsx': productCardUrl,
            })
          );
          window.__BOICHITRA_ADMIN_MOD__ = await import(adminBlobUrl);
          return window.__BOICHITRA_ADMIN_MOD__;
        };

        const lazyAdminProxyUrl = makeBlobUrl(`
          import React, { useEffect, useState } from 'react';
          export function AdminPanel(props) {
            const [Comp, setComp] = useState(null);
            useEffect(() => {
              window.__BOICHITRA_LOAD_ADMIN__().then((m) => setComp(() => m.AdminPanel));
            }, []);
            if (!Comp) {
              return React.createElement(
                'div',
                { className: 'min-h-screen flex items-center justify-center bg-[#F3F5F7] text-[#14213D] font-semibold text-sm' },
                'অ্যাডমিন প্যানেল প্রস্তুত হচ্ছে...'
              );
            }
            return React.createElement(Comp, props);
          }
        `);

        const appUrl = makeBlobUrl(
          replaceImports(compiled.app, {
            './types.ts': typesUrl,
            './lib/bd-locations.ts': bdLocationsUrl,
            './lib/visuals.ts': visualsUrl,
            './components/ProductVisualCard.tsx': productCardUrl,
            './components/AdminPanel.tsx': lazyAdminProxyUrl,
          })
        );

        const AppModule = await import(appUrl);
        createRoot(document.getElementById('root')).render(
          React.createElement(AppModule.default)
        );
      }

      bootBoichitra().catch((err) => {
        console.error('Boichitra boot error:', err);
        localStorage.removeItem(CACHE_KEY);
      });
    </script>
