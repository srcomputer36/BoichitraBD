    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable !== false && (!desc.writable && !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {}

        try {
          window.__BOICHITRA_STOREFRONT_PREFETCH__ = window
            .fetch('/api/storefront', { cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            });

          var localHash = '';
          try {
            var raw = localStorage.getItem('boichitra_cpanel_fast_v12');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.hash && parsed.compiled && parsed.compiled.app) {
                localHash = parsed.hash;
              }
            }
          } catch (_e) {}

          window.__BOICHITRA_BUNDLE_PREFETCH__ = window
            .fetch(
              '/api/compiled-bundle' +
                (localHash ? '?clientHash=' + encodeURIComponent(localHash) : ''),
              { cache: 'no-store' }
            )
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            });
        } catch (_e) {}
      })();
    </script>

    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      const CACHE_KEY = 'boichitra_cpanel_fast_v12';

      function makeBlobUrl(jsCode) {
        return URL.createObjectURL(new Blob([jsCode], { type: 'text/javascript' }));
      }

      function loadBabelOnce() {
        if (window.Babel) return Promise.resolve(window.Babel);
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.9/babel.min.js';
          s.onload = () => resolve(window.Babel);
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }

      function compileTsx(source, filename) {
        return window.Babel.transform(source, {
          presets: ['react', 'typescript'],
          filename,
        }).code;
      }

      const replaceImports = (code, map) => {
        let out = code;
        for (const [target, blobUrl] of Object.entries(map)) {
          out = out.split("'" + target + "'").join("'" + blobUrl + "'");
          out = out.split('"' + target + '"').join('"' + blobUrl + '"');
        }
        return out;
      };

      async function bootBoichitra() {
        let compiled = null;
        let activeHash = 'v12_' + Date.now();
        let localRecord = null;

        try {
          const raw = localStorage.getItem(CACHE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.compiled && parsed.compiled.app) {
              localRecord = parsed;
            }
          }
        } catch (_e) {}

        // Verify server bundle hash so any cPanel deploy immediately invalidates old localStorage
        try {
          const serverBundle = window.__BOICHITRA_BUNDLE_PREFETCH__
            ? await window.__BOICHITRA_BUNDLE_PREFETCH__
            : await fetch('/api/compiled-bundle', { cache: 'no-store' }).then((r) =>
                r.ok ? r.json() : null
              );
          window.__BOICHITRA_BUNDLE_PREFETCH__ = null;

          if (serverBundle && serverBundle.hash) {
            activeHash = serverBundle.hash;
          }

          if (serverBundle && serverBundle.upToDate && localRecord) {
            compiled = localRecord.compiled;
          } else if (
            serverBundle &&
            serverBundle.cached &&
            serverBundle.compiled &&
            serverBundle.compiled.app
          ) {
            compiled = serverBundle.compiled;
            try {
              localStorage.setItem(
                CACHE_KEY,
                JSON.stringify({ hash: activeHash, compiled })
              );
            } catch (_e) {}
          }
        } catch (_e) {
          if (localRecord) {
            compiled = localRecord.compiled;
            activeHash = localRecord.hash || activeHash;
          }
        }

        // If server does not yet have a cached bundle for this deploy hash, compile from /src/* and cache on server
        if (!compiled) {
          const files = [
            '/src/lib/bd-locations.ts',
            '/src/lib/visuals.ts',
            '/src/components/ProductVisualCard.tsx',
            '/src/App.tsx',
          ];
          const [sources] = await Promise.all([
            Promise.all(
              files.map(async (url) => {
                const res = await fetch(url + '?v=' + encodeURIComponent(activeHash), {
                  cache: 'no-store',
                });
                if (!res.ok) throw new Error('Failed to load ' + url);
                return res.text();
              })
            ),
            loadBabelOnce(),
          ]);

          compiled = {
            bdLocations: compileTsx(sources[0], 'bd-locations.ts'),
            visuals: compileTsx(sources[1], 'visuals.ts') + '\nexport const ParsedMediaItem = {};',
            productCard: compileTsx(sources[2], 'ProductVisualCard.tsx'),
            app: compileTsx(sources[3], 'App.tsx'),
          };

          try {
            localStorage.setItem(
              CACHE_KEY,
              JSON.stringify({ hash: activeHash, compiled })
            );
          } catch (_e) {}

          fetch('/api/compiled-bundle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ compiled }),
          }).catch(() => {});
        }

        const typesUrl = makeBlobUrl(
          'export const CartItem = {}; export const Category = {}; export const Coupon = {}; export const Product = {}; export const ProductVariant = {}; export const StoreSettings = {}; export const AuditLogRecord = {}; export const CustomerRecord = {}; export const OrderRecord = {};'
        );
        const bdLocationsUrl = makeBlobUrl(compiled.bdLocations);
        const visualsUrl = makeBlobUrl(compiled.visuals);

        const productCardUrl = makeBlobUrl(
          replaceImports(compiled.productCard, {
            '../types.ts': typesUrl,
            '../lib/bd-locations.ts': bdLocationsUrl,
            '../lib/visuals.ts': visualsUrl,
          })
        );

        window.__BOICHITRA_LOAD_ADMIN__ = async () => {
          if (window.__BOICHITRA_ADMIN_MOD__) return window.__BOICHITRA_ADMIN_MOD__;
          const adminLocalKey = 'boichitra_cpanel_admin_' + activeHash;
          let adminJs = null;

          try {
            adminJs = localStorage.getItem(adminLocalKey);
          } catch (_e) {}

          if (!adminJs) {
            try {
              const srvAdmin = await fetch(
                '/api/compiled-bundle?admin=1&v=' + encodeURIComponent(activeHash),
                { cache: 'no-store' }
              ).then((r) => (r.ok ? r.json() : null));
              if (srvAdmin && srvAdmin.cached && srvAdmin.adminJs) {
                adminJs = srvAdmin.adminJs;
                try {
                  localStorage.setItem(adminLocalKey, adminJs);
                } catch (_e) {}
              }
            } catch (_e) {}
          }

          if (!adminJs) {
            const [adminSrc] = await Promise.all([
              fetch('/src/components/AdminPanel.tsx?v=' + encodeURIComponent(activeHash), {
                cache: 'no-store',
              }).then((r) => r.text()),
              loadBabelOnce(),
            ]);
            adminJs = compileTsx(adminSrc, 'AdminPanel.tsx');
            try {
              localStorage.setItem(adminLocalKey, adminJs);
            } catch (_e) {}
            fetch('/api/compiled-bundle', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ adminJs }),
            }).catch(() => {});
          }

          const adminBlobUrl = makeBlobUrl(
            replaceImports(adminJs, {
              '../types.ts': typesUrl,
              '../lib/bd-locations.ts': bdLocationsUrl,
              '../lib/visuals.ts': visualsUrl,
              './ProductVisualCard.tsx': productCardUrl,
            })
          );
          window.__BOICHITRA_ADMIN_MOD__ = await import(adminBlobUrl);
          return window.__BOICHITRA_ADMIN_MOD__;
        };

        const lazyAdminProxyUrl = makeBlobUrl(`
          import React, { useEffect, useState } from 'react';
          export function AdminPanel(props) {
            const [Comp, setComp] = useState(null);
            useEffect(() => {
              window.__BOICHITRA_LOAD_ADMIN__().then((m) => setComp(() => m.AdminPanel));
            }, []);
            if (!Comp) {
              return React.createElement(
                'div',
                { className: 'min-h-screen flex items-center justify-center bg-[#F3F5F7] text-[#14213D] font-semibold text-sm' },
                'অ্যাডমিন প্যানেল প্রস্তুত হচ্ছে...'
              );
            }
            return React.createElement(Comp, props);
          }
        `);

        const appUrl = makeBlobUrl(
          replaceImports(compiled.app, {
            './types.ts': typesUrl,
            './lib/bd-locations.ts': bdLocationsUrl,
            './lib/visuals.ts': visualsUrl,
            './components/ProductVisualCard.tsx': productCardUrl,
            './components/AdminPanel.tsx': lazyAdminProxyUrl,
          })
        );

        const AppModule = await import(appUrl);
        createRoot(document.getElementById('root')).render(
          React.createElement(AppModule.default)
        );
      }

      bootBoichitra().catch((err) => {
        console.error('Boichitra boot error:', err);
        localStorage.removeItem(CACHE_KEY);
      });
    </script>
