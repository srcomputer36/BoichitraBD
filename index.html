    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable !== false && (!desc.writable && !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var message = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              filename.indexOf('moz-extension://') === 0 ||
              message.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        try {
          window.__BOICHITRA_STOREFRONT_PREFETCH__ = window
            .fetch('/api/storefront')
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .catch(function () {
              return null;
            });
        } catch (_e) {}
      })();
    </script>
